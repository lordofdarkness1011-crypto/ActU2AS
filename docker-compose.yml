services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: cliente
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cliente"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  servicio-cliente:
    build:
      context: ./servicio-cliente
      dockerfile: Dockerfile
    container_name: servicio-cliente
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cliente
      DB_USER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  servicio-producto:
    build:
      context: ./servicio-producto
      dockerfile: Dockerfile
    container_name: servicio-producto
    environment:
      DATABASE_URL: sqlite:///./producto.db
    networks:
      - microservices-network
    restart: unless-stopped

  servicio-factura:
    build:
      context: ./servicio-factura
      dockerfile: Dockerfile
    container_name: servicio-factura
    environment:
      PORT: 3003
      DATABASE_URL: mongodb://mongo:27017/factura
      CLIENTE_SERVICE_URL: http://servicio-cliente:3001/api/clientes
      PRODUCTO_SERVICE_URL: http://servicio-producto:3002/api/productos
    depends_on:
      mongo:
        condition: service_healthy
      servicio-cliente:
        condition: service_started
      servicio-producto:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      SERVICIO_CLIENTE_URL: http://servicio-cliente:3001
      SERVICIO_PRODUCTO_URL: http://servicio-producto:3002
      SERVICIO_FACTURA_URL: http://servicio-factura:3003
    depends_on:
      - servicio-cliente
      - servicio-producto
      - servicio-factura
    networks:
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:

networks:
  microservices-network:
    driver: bridge
