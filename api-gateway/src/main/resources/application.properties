spring.application.name=api-gateway
server.port=3000
server.address=0.0.0.0

#Servicio Cliente
spring.cloud.gateway.server.webflux.routes[0].id=servicio-Cliente
spring.cloud.gateway.server.webflux.routes[0].uri=${SERVICIO_CLIENTE_URL:http://servicio-cliente:3001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**

#Servicio Producto
spring.cloud.gateway.server.webflux.routes[1].id=servicio-producto
spring.cloud.gateway.server.webflux.routes[1].uri=${SERVICIO_PRODUCTO_URL:http://servicio-producto:3002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

#Servicio Facturas
spring.cloud.gateway.server.webflux.routes[2].id=servicio-facturas
spring.cloud.gateway.server.webflux.routes[2].uri=${SERVICIO_FACTURA_URL:http://servicio-factura:3003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/facturas/**

#Home
spring.cloud.gateway.server.webflux.routes[3].id=home
spring.cloud.gateway.server.webflux.routes[3].uri=forward:/
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/

#Not Found
spring.cloud.gateway.server.webflux.routes[4].id=not-found
spring.cloud.gateway.server.webflux.routes[4].uri=forward:/not-found
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/not-found
spring.cloud.gateway.server.webflux.routes[4].order=999
